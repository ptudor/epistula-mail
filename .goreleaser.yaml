      - src: docs/linux-packages.md
        dst: /usr/share/doc/epistula-mcp/linux-packages.md
      - src: THIRD_PARTY_NOTICES.md
        dst: /usr/share/doc/epistula-mcp/copyright
    scripts:
      preinstall: packaging/epistula-mcp-preinstall.sh
      postinstall: packaging/epistula-mcp-postinstall.sh
      preremove: packaging/epistula-mcp-preremove.sh
      postremove: packaging/postremove.sh
checksum:
  name_template: checksums.txt
  algorithm: sha256
signs:
  - artifacts: checksum
    cmd: gpg
    stdin: '{{ .Env.NFPM_PASSPHRASE }}'
    args:
      - --batch
      - --pinentry-mode=loopback
      - --passphrase-fd=0
      - --local-user={{ .Env.RELEASE_GPG_FINGERPRINT }}
      - --output=${signature}
      - --detach-sign
      - ${artifact}
changelog:
  disable: true
release:
  github:
    owner: ptudor
    name: epistula-mail
  draft: true
  prerelease: auto
  header: |
    Epistula's five executables are included in each platform archive.
    Linux DEBs and RPMs install without starting or enabling services.
    Packages and checksums.txt use the published OpenPGP release key.
    See docs/releases.md for verification and docs/linux-packages.md for setup.
