# epistula-imap Apache Include fragment
#
# Include this inside an existing <VirtualHost> block:
#   Include /usr/local/etc/apache24/includes/epistula-imap-include.conf
#
# Requires: mod_proxy, mod_proxy_http, mod_headers
#
# Exposes the Prometheus /metrics + /health endpoints from
# `epistula-imap serve` (which by default binds 127.0.0.1:8783) over
# the surrounding vhost. Restrict /metrics to internal IPs — the
# admin listener intentionally has no auth because it has no
# privileged surface to protect (no admin CRUD, no message access).
#
# The IMAP protocol itself is NOT reverse-proxied: clients connect
# directly to :993 over implicit TLS. Apache only fronts the
# observability surface here.

<Location "/metrics">
    <LimitExcept GET HEAD>
        Require all denied
    </LimitExcept>
    # Loopback only; widen to your monitoring network.
    Require ip 127.0.0.1 ::1
</Location>

<Location "/health">
    <LimitExcept GET HEAD>
        Require all denied
    </LimitExcept>
    Require all granted
</Location>

<Location "/healthz">
    <LimitExcept GET HEAD>
        Require all denied
    </LimitExcept>
    Require all granted
</Location>

# Proxy to the loopback admin listener.
ProxyPass        "/metrics" "http://127.0.0.1:8783/metrics"
ProxyPassReverse "/metrics" "http://127.0.0.1:8783/metrics"
ProxyPass        "/health"  "http://127.0.0.1:8783/health"
ProxyPassReverse "/health"  "http://127.0.0.1:8783/health"
ProxyPass        "/healthz" "http://127.0.0.1:8783/healthz"
ProxyPassReverse "/healthz" "http://127.0.0.1:8783/healthz"

ProxyTimeout 10
