# epistula-database Apache Include fragment
#
# Include this inside an existing <VirtualHost> block:
#   Include /usr/local/etc/apache24/includes/epistula-database-include.conf
#
# Requires: mod_proxy, mod_proxy_http, mod_headers
#
# Exposes the Prometheus /metrics + /health endpoints from
# `epistula-database serve` (which by default binds 127.0.0.1:8782) over
# the surrounding vhost. Restrict to internal IPs — there is no auth
# on these endpoints because the serve listener intentionally has no
# admin surface to protect.
#
# The LDA itself is not reverse-proxied: Postfix invokes
# `epistula-database deliver` directly via pipe(8). See deploy/postfix/
# for that integration.

<Location "/metrics">
    <LimitExcept GET HEAD>
        Require all denied
    </LimitExcept>
    # Loopback only; widen this to your monitoring network.
    Require ip 127.0.0.1 ::1
</Location>

<Location "/health">
    <LimitExcept GET HEAD>
        Require all denied
    </LimitExcept>
    Require all granted
</Location>

<Location "/healthz">
    <LimitExcept GET HEAD>
        Require all denied
    </LimitExcept>
    Require all granted
</Location>

# Proxy to the loopback admin listener.
ProxyPass        "/metrics" "http://127.0.0.1:8782/metrics"
ProxyPassReverse "/metrics" "http://127.0.0.1:8782/metrics"
ProxyPass        "/health"  "http://127.0.0.1:8782/health"
ProxyPassReverse "/health"  "http://127.0.0.1:8782/health"
ProxyPass        "/healthz" "http://127.0.0.1:8782/healthz"
ProxyPassReverse "/healthz" "http://127.0.0.1:8782/healthz"

ProxyTimeout 10
