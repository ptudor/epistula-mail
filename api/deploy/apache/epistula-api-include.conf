# epistula-api Apache Include fragment
#
# Include this inside an existing <VirtualHost *:443> block:
#   Include /usr/local/etc/apache24/includes/epistula-api-include.conf
#
# Requires: mod_proxy, mod_proxy_http, mod_headers
#
# Apache terminates TLS for the JSON API (the Go process binds loopback
# and never faces the network). For consumers on other hosts, add mTLS
# (SSLVerifyClient in the surrounding vhost) — defense in depth on top of
# the bearer token.

# The whole API surface lives under /v1.
<Location "/v1">
    # POST is for /v1/pass-required/prune (the worker's pass-queue prune).
    <LimitExcept GET PUT POST HEAD>
        Require all denied
    </LimitExcept>
    # Tighten as the deployment requires; bearer tokens are the
    # application-level gate either way.
    Require all granted
</Location>

# NDJSON export streams are long-lived, so give the export worker its own
# 1-hour timeout. This MUST be a more-specific ProxyPass placed BEFORE the
# generic /v1 mapping — mod_proxy matches ProxyPass rules first-match-wins, and
# ProxyTimeout is not valid inside <Location> (Apache 2.4 refuses to load it
# there, taking down the whole vhost).
ProxyPass        "/v1/export" "http://127.0.0.1:8784/v1/export" timeout=3600
ProxyPassReverse "/v1/export" "http://127.0.0.1:8784/v1/export"

ProxyPass        "/v1" "http://127.0.0.1:8784/v1"
ProxyPassReverse "/v1" "http://127.0.0.1:8784/v1"

# Observability endpoints from the loopback admin listener. Restrict
# /metrics to internal IPs — it is unauthenticated by design.
<Location "/metrics">
    <LimitExcept GET HEAD>
        Require all denied
    </LimitExcept>
    # Loopback only; widen to your monitoring network as needed.
    Require ip 127.0.0.1 ::1
</Location>

<Location "/health">
    <LimitExcept GET HEAD>
        Require all denied
    </LimitExcept>
    Require all granted
</Location>

<Location "/healthz">
    <LimitExcept GET HEAD>
        Require all denied
    </LimitExcept>
    Require all granted
</Location>

ProxyPass        "/metrics" "http://127.0.0.1:8785/metrics"
ProxyPassReverse "/metrics" "http://127.0.0.1:8785/metrics"
ProxyPass        "/health"  "http://127.0.0.1:8785/health"
ProxyPassReverse "/health"  "http://127.0.0.1:8785/health"
ProxyPass        "/healthz" "http://127.0.0.1:8785/healthz"
ProxyPassReverse "/healthz" "http://127.0.0.1:8785/healthz"
