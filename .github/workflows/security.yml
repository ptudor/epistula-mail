name: Epistula security checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '19 8 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  vulnerabilities:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [database, imap, api, llm-worker, mcp]
        target: [linux, freebsd]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: '**/go.sum'
      - name: Install pinned vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Scan the production target
        working-directory: ${{ matrix.module }}
        env:
          GOOS: ${{ matrix.target }}
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          govulncheck -scan=module -format=json > "$RUNNER_TEMP/module-advisories.json"
          govulncheck -scan=package ./...
          govulncheck ./...
      - name: Save the complete module advisory report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: advisories-${{ matrix.module }}-${{ matrix.target }}
          path: ${{ runner.temp }}/module-advisories.json
          if-no-files-found: error
          retention-days: 14

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan full history with redacted output
        run: '"$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --log-opts=--all'
