name: Epistula CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.module }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        module: [database, imap, api, llm-worker, mcp]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: '**/go.sum'
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -count=1 -timeout=10m ./...
        env:
          CGO_ENABLED: '1'

  integration:
    name: PostgreSQL integration (${{ matrix.module }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: [database, imap, api]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: '**/go.sum'
      - name: Run integration and unit tests with race detector
        working-directory: ${{ matrix.module }}
        env:
          MAIL_DATABASE_TEST_PG: postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable
          CGO_ENABLED: '1'
        run: go test -race -count=1 -timeout=15m ./...

  packages:
    name: Build and verify signed snapshot packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: '**/go.sum'
      - name: Check module toolchain pins
        run: sh scripts/check-toolchains.sh
      - name: Check example and package configuration keys
        run: python3 scripts/check-config-keys.py
      - name: Check workflow and shell syntax
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
          shellcheck -s sh -e SC1091 packaging/*.sh scripts/*.sh */deploy/freebsd/epistula_*
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: v2.18.1
          install-only: true
      - run: make release-check
      - run: make snapshot
      - run: make check-notices
      - run: make test-packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: epistula-mail-snapshot
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
            dist/checksums.txt.sig
            dist/snapshot-signing-key.asc
          if-no-files-found: error
          retention-days: 14
