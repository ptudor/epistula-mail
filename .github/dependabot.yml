version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: gomod
    directories: [/database, /imap, /api, /llm-worker, /mcp]
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      go-dependencies:
        patterns: ['*']
